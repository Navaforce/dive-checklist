<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Gear Check">
<meta name="theme-color" content="#0a1a26">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Gear Check</title>
<style>
:root{--bg:#0a1a26;--card:#12303f;--line:#1f4a5e;--ink:#e8f6f8;--mut:#8fb2bf;--ok:#22a85f;--acc:#ffb703;--bad:#d63b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
#mic{width:100%;min-height:64px;border:0;border-radius:16px;background:var(--acc);color:#1b1b1b;font:800 19px/1.2 -apple-system,system-ui,sans-serif}
#mic.on{background:var(--bad);color:#fff}
#heard{min-height:44px;margin:10px 0 14px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:15px}
#heard b{color:var(--ink)}
.prog{font-weight:800;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sec{margin:0 0 14px;border:1.5px solid var(--line);border-radius:16px;background:#0e2532;overflow:hidden}
.sec>.hd{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border:0;background:transparent;color:var(--ink);font:800 19px/1.2 -apple-system,system-ui,sans-serif;text-align:left}
.sec>.hd .ct{font-weight:700;font-size:15px;color:var(--mut)}
.sec>.hd .chev{display:inline-block;margin-right:8px;transition:transform .15s}
.sec.closed>.hd .chev{transform:rotate(-90deg)}
.sec ul{padding:0 10px 10px}
.sec.closed ul{display:none}
.sec.complete{border-color:var(--ok);background:var(--ok)}
.sec.complete>.hd,.sec.complete>.hd .ct{color:#fff}
li .note{font-weight:500;font-size:14px;color:var(--mut)}
li.done .note{color:#bfe8d0}
li{display:flex;gap:8px;align-items:stretch}
li button.chk{flex:1;width:auto}
li button.x{flex:none;width:56px;min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:700 20px/1 -apple-system,system-ui,sans-serif}
li button.x:active{background:var(--bad);color:#fff;border-color:var(--bad)}
.sec.complete li button.x{background:#12392b;border-color:var(--ok)}
li button.addb{width:100%;min-height:52px;border-radius:14px;border:1.5px dashed var(--mut);background:transparent;color:var(--mut);font:700 17px/1.2 -apple-system,system-ui,sans-serif}
.addf{display:flex;gap:8px;width:100%}
.addf input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid var(--acc);background:#fff;color:#111;padding:0 12px;font:600 17px/1.2 -apple-system,system-ui,sans-serif}
.addf .go,.addf .cx{flex:none;width:auto;min-height:52px;padding:0 14px;border-radius:12px;font:800 16px/1.2 -apple-system,system-ui,sans-serif}
.addf .go{border:0;background:var(--ok);color:#fff}
.addf .cx{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
li button{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 20px/1.2 -apple-system,system-ui,sans-serif;text-align:left}
li button .box{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;font-size:20px;color:transparent}
li.done button{border-color:var(--ok);background:#12392b}
li.done button .box{background:var(--ok);border-color:var(--ok);color:#fff}
li.done button .nm{text-decoration:line-through;opacity:.75}
.row{display:flex;gap:10px;margin-top:14px}
.row button[hidden]{display:none}
.row button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 16px/1.2 -apple-system,system-ui,sans-serif}
</style>
</head>
<body>
<h1>Gear Check</h1>
<p class="sub">Tap Start Listening, then say each item.</p>
<button id="mic" type="button">Start Listening</button>
<div id="heard" aria-live="polite">Heard: <b>nothing yet</b></div>
<div class="prog" id="prog"></div>
<div id="list"></div>
<div class="row"><button id="reset" type="button">Reset</button><button id="restore" type="button" hidden>Restore removed</button></div>
<script>
"use strict";
const SECTIONS=[
 {name:'Dive Clothing',items:[
  {n:'Top',a:['wetsuit top','suit top']},
  {n:'Bottom',a:['wetsuit bottom','suit bottom','bottoms']},
  {n:'Booties',a:['bootie','boots']},
  {n:'Gloves',a:['glove']}
 ]},
 {name:'Dive Equipment',items:[
  {n:'Fins',a:['fin','finns','pins','thins','thin','fence','fens','fines','fiends','phins','finz']},
  {n:'Fin Straps',a:['fin strap','fins straps','thin straps']},
  {n:'Belt',a:['dive belt','diving belt','weight belt']},
  {n:'Knife',a:['dive knife']},
  {n:'Weights',a:['weight']},
  {n:'Stringer',a:['stringers']},
  {n:'Flashlight',a:['flash light','light','dive light']},
  {n:'Belt Reel',a:['belt real','belt reels']},
  {n:'Gun',a:['spear gun','speargun','spear','spare gun']},
  {n:'Spear Cap',a:['spear tip cap','spear cover']},
  {n:'Reel',a:['gun reel','real','reels']},
  {n:'Load Assist',a:['loader','load assistant','load assist tool']},
  {n:'Float Line with Connectors',a:['float line','floatline','floating line']},
  {n:'Buoy',a:['boy','buoys','bouy','buoy float']},
  {n:'Buoy Pump',a:['boy pump','pump','buoy hand pump']},
  {n:'Mask',a:['masks']},
  {n:'Mask Case',a:['mask box']},
  {n:'Snorkel Keeper',a:['snorkel strap','snorkel clip']},
  {n:'Snorkel',a:['snorkle','snorkeling']},
  {n:'Line',a:['buoy line','dive line']},
  {n:'Drop Weight',a:['drop weights','dropweight','drop way']},
  {n:'Connectors',a:['connector','clips']},
  {n:'Throw Flasher',a:['throw flash','throw flashing','throw light']},
  {n:'Line Flasher',a:['line flash','line flashing','line light']},
  {n:'Dive Flag',a:['flag','diver down flag']}
 ]},
 {name:'Other Equipment',items:[
  {n:'Tickle Stick',a:['tickle','tickle sticks']},
  {n:'Gauge',a:['lobster gauge','gage']},
  {n:'Lobster Bag',a:['lobster bags']},
  {n:'Snare',a:['snares']},
  {n:'Net',a:['lobster net']},
  {n:'Towel',a:['towels']},
  {n:'Dive Trunks',a:['trunks','swim trunks','bathing suit']},
  {n:'No Tears Shampoo',note:'Mask',a:['shampoo','no tears','baby shampoo']},
  {n:'Dish Soap',note:'Suit',a:['soap','dish soup']},
  {n:'Dive Watch',note:'Charger?',a:['watch','dive computer']},
  {n:'Go Pro with Harness',note:'Battery Charged?',a:['gopro','go pro','gopro with harness','camera','harness']},
  {n:'Snack',a:['snacks']},
  {n:'Water / Electrolytes',a:['water','electrolytes','electrolyte']},
  {n:'Change Clothes',a:['change of clothes','clothes','dry clothes']},
  {n:'Dry Bag',a:['drybag','dry bags']},
  {n:'Plastic Bags',note:'for fish',a:['plastic bag','fish bags','baggies']},
  {n:'Filet Knife',a:['fillet knife','filet','fillet','fish knife']},
  {n:'Fish Scale',a:['scale','fish scales']},
  {n:'Hat',a:['hats','cap']},
  {n:'Sun Screen',a:['sunscreen','sun block','sunblock']},
  {n:'Face Covering',a:['face cover','buff','neck gaiter','gaiter']},
  {n:'Line Diving Lanyard',a:['lanyard','line dive lanyard','diving lanyard']},
  {n:'Cooler',a:['coolers']},
  {n:'Ice',a:['ice bag']},
  {n:'Gear Bin (Small)',a:['small gear bin','small bin','gear bin small']},
  {n:'Gear Bin (Large)',a:['large gear bin','large bin','big gear bin','big bin','gear bin large']}
 ]},
 {name:'Kayak',items:[
  {n:'Kayak',a:['boat','kayaks']},
  {n:'Oar',a:['oars','paddle','paddles']},
  {n:'Anchor',a:['anchors']},
  {n:'Kayak Lead',a:['kayak lead weight','tie up lead','tie up']},
  {n:'Kayak Stringer',a:['boat stringer']},
  {n:'Mesh Dive Gear Bag',a:['mesh bag','mesh gear bag','mesh dive bag','gear bag']},
  {n:'Dry Bag',noOwn:true,a:['kayak dry bag','boat dry bag']},
  {n:'Car Tie Downs',a:['tie downs','tie down','car tie down','straps']},
  {n:'Oar Leashes',a:['oar leash','paddle leash','paddle leashes']}
 ]}
];
const $=id=>document.getElementById(id);
const norm=t=>' '+t.toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim()+' ';
const STORE='gearcheck.edits.v1';
function loadEdits(){
 try{const e=JSON.parse(localStorage.getItem(STORE)||'{}');return{removed:Array.isArray(e.removed)?e.removed:[],added:Array.isArray(e.added)?e.added:[]}}catch(e){return{removed:[],added:[]}}
}
function saveEdits(){try{localStorage.setItem(STORE,JSON.stringify(edits))}catch(e){}}
const edits=loadEdits();
function prep(it,si,id){
 it.sec=si;it.id=id;
 const own=norm(it.n).trim();
 it.aliases=(it.noOwn?[]:[own]).concat((it.a||[]).map(a=>norm(a).trim()));
 return it;
}
const BASE=[];
SECTIONS.forEach((s,si)=>s.items.forEach(it=>BASE.push(prep(it,si,'d'+si+':'+it.n))));
let ITEMS=[],ALIASES=[];
function rebuild(){
 const rm=new Set(edits.removed);
 ITEMS=BASE.filter(it=>!rm.has(it.id));
 edits.added.forEach(a=>{
  if(!SECTIONS[a.sec])return;
  const own=norm(a.n).trim();
  const al=[own];
  if(own.endsWith('s'))al.push(own.slice(0,-1));else al.push(own+'s');
  ITEMS.push({n:a.n,sec:a.sec,id:a.id,aliases:al,custom:true});
 });
 ITEMS.sort((x,y)=>x.sec-y.sec);
 ALIASES=[];
 ITEMS.forEach((it,i)=>it.aliases.forEach(a=>ALIASES.push({a:' '+a+' ',len:a.length,i})));
 ALIASES.sort((x,y)=>y.len-x.len);
 const ids=new Set(ITEMS.map(it=>it.id));
 [...done].forEach(id=>{if(!ids.has(id))done.delete(id)});
}
const done=new Set();
const closed=new Set();
let adding=-1,addDraft='';

function secStats(si){
 let d=0,t=0;
 ITEMS.forEach(it=>{if(it.sec===si){t++;if(done.has(it.id))d++}});
 return{d,t};
}
const isComplete=si=>{const s=secStats(si);return s.t>0&&s.d===s.t};
function settle(si,was){
 const now=isComplete(si);
 if(now&&!was)closed.add(si);
 if(!now)closed.delete(si);
}
function setDone(i,val){
 const it=ITEMS[i],was=isComplete(it.sec);
 val?done.add(it.id):done.delete(it.id);
 settle(it.sec,was);
}
function removeItem(i){
 const it=ITEMS[i],was=isComplete(it.sec);
 if(it.custom)edits.added=edits.added.filter(a=>a.id!==it.id);
 else edits.removed.push(it.id);
 saveEdits();rebuild();settle(it.sec,was);draw();
}
function addItem(si,name){
 name=name.replace(/\s+/g,' ').trim();
 if(!name)return false;
 const key=norm(name);
 if(ITEMS.some(it=>it.sec===si&&norm(it.n)===key))return false;
 const was=isComplete(si);
 edits.added.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:name,sec:si});
 saveEdits();rebuild();settle(si,was);
 return true;
}
function restoreRemoved(){
 const was=SECTIONS.map((_,si)=>isComplete(si));
 edits.removed=[];saveEdits();rebuild();
 SECTIONS.forEach((_,si)=>settle(si,was[si]));
 draw();
}

function draw(){
 const root=$('list');root.textContent='';
 let focusEl=null;
 SECTIONS.forEach((sec,si)=>{
  const st=secStats(si),complete=isComplete(si);
  const box=document.createElement('section');
  box.className='sec'+(complete?' complete':'')+(closed.has(si)?' closed':'');
  const hd=document.createElement('button');hd.type='button';hd.className='hd';
  hd.setAttribute('aria-expanded',closed.has(si)?'false':'true');
  const l=document.createElement('span');
  const ch=document.createElement('span');ch.className='chev';ch.textContent='▾';
  l.append(ch,document.createTextNode(sec.name));
  const ct=document.createElement('span');ct.className='ct';ct.textContent=complete?'✓ '+st.t+' of '+st.t:st.d+' of '+st.t;
  hd.append(l,ct);
  hd.onclick=()=>{closed.has(si)?closed.delete(si):closed.add(si);draw()};
  const ul=document.createElement('ul');
  ITEMS.forEach((it,i)=>{
   if(it.sec!==si)return;
   const li=document.createElement('li');li.className=done.has(it.id)?'done':'';
   const b=document.createElement('button');b.type='button';b.className='chk';
   const bx=document.createElement('span');bx.className='box';bx.textContent='✓';
   const nm=document.createElement('span');nm.className='nm';nm.textContent=it.n;
   b.append(bx,nm);
   if(it.note){const nt=document.createElement('span');nt.className='note';nt.textContent='('+it.note+')';b.append(nt)}
   b.onclick=()=>{setDone(i,!done.has(it.id));draw()};
   const x=document.createElement('button');x.type='button';x.className='x';x.textContent='✕';
   x.setAttribute('aria-label','Remove '+it.n);
   x.onclick=()=>removeItem(i);
   li.append(b,x);ul.append(li);
  });
  const addLi=document.createElement('li');
  if(adding===si){
   const f=document.createElement('form');f.className='addf';
   const inp=document.createElement('input');inp.type='text';inp.value=addDraft;inp.placeholder='New item name';
   inp.autocapitalize='words';inp.autocomplete='off';inp.setAttribute('aria-label','New item in '+sec.name);
   inp.oninput=()=>{addDraft=inp.value};
   const ok=document.createElement('button');ok.type='submit';ok.className='go';ok.textContent='Add';
   const no=document.createElement('button');no.type='button';no.className='cx';no.textContent='Cancel';
   no.onclick=()=>{adding=-1;addDraft='';draw()};
   f.onsubmit=e=>{e.preventDefault();if(addItem(si,inp.value)){addDraft='';draw()}else inp.focus()};
   f.append(inp,ok,no);addLi.append(f);
   focusEl=focusEl||inp;
  }else{
   const ab=document.createElement('button');ab.type='button';ab.className='addb';ab.textContent='+ Add item';
   ab.onclick=()=>{adding=si;addDraft='';draw()};
   addLi.append(ab);
  }
  ul.append(addLi);
  box.append(hd,ul);root.append(box);
 });
 $('prog').textContent=done.size+' of '+ITEMS.length+' checked'+(ITEMS.length&&done.size===ITEMS.length?' — all set':'');
 const rb=$('restore');rb.hidden=!edits.removed.length;rb.textContent='Restore removed ('+edits.removed.length+')';
 if(focusEl&&focusEl.focus)focusEl.focus();
}
function matchText(text){
 let t=norm(text);const hit=[];
 ALIASES.forEach(x=>{
  if(!t.includes(x.a))return;
  t=t.split(x.a).join(' ');
  if(!done.has(ITEMS[x.i].id)&&!hit.includes(x.i))hit.push(x.i);
 });
 hit.forEach(i=>setDone(i,true));
 if(hit.length)draw();
 return hit;
}
function setHeard(t,hit){
 const h=$('heard');h.textContent='Heard: ';
 const b=document.createElement('b');b.textContent=t||'nothing yet';h.append(b);
 if(hit&&hit.length)h.append(' → checked '+hit.map(i=>ITEMS[i].n).join(', '));
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,want=false,wakeLock=null,restartTimer=null;

async function keepAwake(){
 try{if(navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}
}
function start(){
 if(!want)return;
 if(!SR){stopAll();setHeard('Voice recognition is not available in this browser. Tap items to check them.',null);return}
 rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=ev=>{
  let heard='',hit=[];
  for(let i=ev.resultIndex;i<ev.results.length;i++){
   for(let a=0;a<ev.results[i].length;a++){
    const tx=ev.results[i][a].transcript;
    if(a===0)heard+=tx+' ';
    hit=hit.concat(matchText(tx));
   }
  }
  setHeard(heard.trim(),hit);
 };
 rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){stopAll();setHeard('Microphone blocked. Allow it in Settings > Safari > Microphone, then reload.',null)}};
 rec.onend=()=>{
  if(want){restartTimer=setTimeout(()=>{restartTimer=null;try{start()}catch(e){}},250)}
  else{$('mic').classList.remove('on');$('mic').textContent='Start Listening'}
 };
 try{rec.start()}catch(e){}
}
function stopAll(){
 want=false;
 if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
 const r=rec;rec=null;
 if(r){r.onresult=null;r.onerror=null;r.onend=null;try{r.abort()}catch(e){}try{r.stop()}catch(e){}}
 if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}
 $('mic').classList.remove('on');$('mic').textContent='Start Listening';
 }
$('mic').onclick=()=>{
 if(want){stopAll();return}
 want=true;$('mic').classList.add('on');$('mic').textContent='Stop Listening';
 keepAwake();start();
};
$('restore').onclick=restoreRemoved;
$('reset').onclick=()=>{done.clear();closed.clear();setHeard('',null);draw()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&want&&!wakeLock)keepAwake()});
rebuild();
draw();
</script>
</body>
</html>
